version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: upscale-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data

  worker:
    build: .
    container_name: upscale-worker
    command: celery -A app.tasks worker --loglevel=info --concurrency=2
    volumes:
      - ./model:/app/model
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped

  api:
    build: .
    container_name: upscale-api
    command: flask run --host=0.0.0.0 --port=5000
    ports:
      - "5000:5000"
    volumes:
      - ./model:/app/model
    environment:
      - FLASK_APP=app.main
      - FLASK_ENV=development
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis
      - worker
    restart: unless-stopped

volumes:
  redis_data:
